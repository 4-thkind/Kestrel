<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kestrel demo stage</title>
<style>
@font-face { font-family: "Jakarta"; src: url("assets/jakarta.woff2") format("woff2"); font-weight: 200 800; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2190-2193, U+2212, U+2215, U+FEFF, U+FFFD; }
@font-face { font-family: "Serif"; src: url("assets/serif.woff2") format("woff2"); font-style: normal; }
@font-face { font-family: "Serif"; src: url("assets/serif-italic.woff2") format("woff2"); font-style: italic; }
:root { --paper: #F3EEE4; --ink: #17140F; --ink2: #4B453B; --mute: #8C8476; --line: #D8CFBF; --teal: #0B6E6D; --amber: #C9801A;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .4  0 0 0 0 .33  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); font-family: "Jakarta", "Nirmala UI", system-ui, sans-serif; color: var(--ink); }
/* paper grain + soft vignette: warm and physical, no glowing gradients */
#bg, #card { background-color: var(--paper); }
#bg { position: absolute; inset: 0; }
#bg::before, #card::before { content: ""; position: absolute; inset: 0; opacity: .55; mix-blend-mode: multiply; background-image: var(--grain); pointer-events: none; }
#bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(1400px 900px at 50% 45%, transparent 60%, rgba(120,100,70,.16)); }

/* ---------- device ---------- */
#device { position: absolute; transition: all .7s cubic-bezier(.7,0,.2,1); }
.phone #device { left: 230px; top: 50px; width: 466px; height: 988px; border-radius: 62px; padding: 13px;
  background: #1B1915; box-shadow: 0 0 0 1px #000, 0 50px 80px -30px rgba(60,40,10,.45), 0 20px 40px -20px rgba(60,40,10,.35); }
.phone #screen { width: 440px; height: 962px; border-radius: 50px; overflow: hidden; position: relative; background: #fff; }
.phone #app { width: 390px; height: 852px; transform: scale(1.128); transform-origin: 0 0; border: 0; display: block; }
.phone #island { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); width: 118px; height: 32px; border-radius: 20px; background: #0b0a08; z-index: 3; }
.laptop #device { left: 70px; top: 110px; width: 1272px; height: 842px; border-radius: 16px; padding: 0;
  background: #1B1915; box-shadow: 0 0 0 1px #000, 0 50px 90px -30px rgba(60,40,10,.45); }
.laptop #chrome-bar { display: flex; }
#chrome-bar { display: none; height: 42px; align-items: center; gap: 8px; padding: 0 16px; background: #24211c; border-radius: 16px 16px 0 0; }
#chrome-bar i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
#chrome-bar i:nth-child(2) { background: #febc2e; } #chrome-bar i:nth-child(3) { background: #28c840; }
#chrome-bar span { margin-left: 18px; flex: 1; background: #151310; color: #a9a294; border-radius: 8px; padding: 6px 14px; font-size: 15px; }
.laptop #screen { width: 1272px; height: 800px; overflow: hidden; border-radius: 0 0 16px 16px; background: #fff; position: relative; }
.laptop #app { width: 1440px; height: 906px; transform: scale(.8834); transform-origin: 0 0; border: 0; display: block; }
.laptop #island { display: none; }

/* ---------- caption panel ---------- */
#panel { position: absolute; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; transition: all .7s cubic-bezier(.7,0,.2,1); }
.phone #panel { left: 830px; width: 960px; }
.laptop #panel { left: 1400px; width: 470px; }
#chapter { font-size: 20px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--ink2); display: flex; align-items: center; gap: 16px; }
#chapter b { color: var(--amber); font-variant-numeric: tabular-nums; }
#chapter::after { content: ""; flex: 0 0 80px; height: 1px; background: var(--line); }
#title { font-family: "Serif", serif; font-weight: 400; font-size: 112px; line-height: .98; letter-spacing: -.015em; margin: 26px 0 30px; }
.laptop #title { font-size: 70px; }
#title em { font-style: italic; color: var(--teal); }
#sub { font-size: 29px; line-height: 1.45; color: var(--ink2); max-width: 820px; font-weight: 500; }
.laptop #sub { font-size: 23px; }
.swap { animation: swap .7s cubic-bezier(.2,.7,.2,1) both; }
@keyframes swap { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
#pills { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 36px; }
#pills span { font-size: 20px; font-weight: 600; padding: 10px 18px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--ink2); background: rgba(255,255,255,.45); }
#pills span.hot { border-color: var(--amber); color: #7a4a06; background: rgba(201,128,26,.10); }

/* ---------- subtitles ---------- */
#subs { position: absolute; bottom: 44px; transition: left .7s, width .7s; }
.phone #subs { left: 830px; width: 960px; }
.laptop #subs { left: 1400px; width: 470px; bottom: 60px; }
#subs p { display: inline; font-size: 24px; line-height: 1.55; font-weight: 600; color: #F6F1E7; background: var(--ink); padding: 6px 14px; border-radius: 8px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.laptop #subs p { font-size: 19px; }

/* ---------- chrome ---------- */
#progress { position: absolute; top: 52px; right: 60px; display: flex; gap: 6px; align-items: center; }
#progress i { width: 30px; height: 3px; border-radius: 2px; background: var(--line); transition: background .5s; }
#progress i.on { background: var(--ink); }
#brand { position: absolute; top: 36px; left: 60px; display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 24px; letter-spacing: -.01em; }
#brand img { width: 38px; height: 38px; }
.phone #brand { left: 830px; }

/* ---------- tap ripple ---------- */
.tap { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; pointer-events: none; z-index: 50;
  background: rgba(201,128,26,.30); border: 3px solid rgba(201,128,26,.95); animation: tap .75s ease-out forwards; }
@keyframes tap { from { transform: scale(.35); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }

/* ---------- full-screen cards ---------- */
#card { position: absolute; inset: 0; z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  opacity: 0; pointer-events: none; transition: opacity .7s; }
#card.show { opacity: 1; }
#card > * { position: relative; }
#card img { width: 140px; height: 140px; }
#card h1 { font-family: "Serif", serif; font-weight: 400; font-size: 200px; line-height: .95; letter-spacing: -.02em; margin-top: 8px; }
#card h2 { font-family: "Serif", serif; font-weight: 400; font-size: 124px; line-height: 1; max-width: 1500px; }
#card h1 em, #card h2 em { font-style: italic; color: var(--teal); }
#card p { font-size: 32px; color: var(--ink2); margin-top: 26px; font-weight: 500; max-width: 1200px; line-height: 1.45; }
#card .tag { margin-top: 40px; font-size: 19px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink2); font-weight: 700; }
#card .small { font-size: 16px; color: var(--mute); margin-top: 50px; letter-spacing: 0; text-transform: none; }
#card.show > * { animation: swap .9s cubic-bezier(.2,.7,.2,1) both; }
#card.show > *:nth-child(2) { animation-delay: .12s; } #card.show > *:nth-child(3) { animation-delay: .24s; } #card.show > *:nth-child(4) { animation-delay: .36s; } #card.show > *:nth-child(5) { animation-delay: .48s; }
</style>
</head>
<body class="phone">
<div id="bg"></div>
<div id="brand"><img src="assets/logo-mark.png" alt=""><span>Kestrel</span></div>
<div id="progress"></div>
<div id="device"><div id="chrome-bar"><i></i><i></i><i></i><span id="url">kestrel.app/#/officer</span></div>
  <div id="screen"><div id="island"></div><iframe id="app" allow="geolocation"></iframe></div></div>
<aside id="panel"><div id="chapter"></div><h1 id="title"></h1><p id="sub"></p><div id="pills"></div></aside>
<div id="subs"></div>
<div id="card"></div>
<script>
const $ = (id) => document.getElementById(id);
window.stage = {
  chapters(n) { $("progress").innerHTML = "<i></i>".repeat(n); },
  set({ n, chapter, title, sub, pills = [] }) {
    $("chapter").innerHTML = `<b>${String(n).padStart(2, "0")}</b>${chapter}`;
    $("title").innerHTML = title;
    $("sub").textContent = sub || "";
    $("pills").innerHTML = pills.map((p) => `<span class="${p.startsWith("!") ? "hot" : ""}">${p.replace(/^!/, "")}</span>`).join("");
    for (const el of [$("chapter"), $("title"), $("sub"), $("pills")]) { el.classList.remove("swap"); void el.offsetWidth; el.classList.add("swap"); }
    [...$("progress").children].forEach((i, k) => i.classList.toggle("on", k < n));
  },
  subtitle(text) { $("subs").innerHTML = text ? `<p>${text}</p>` : ""; },
  mode(m) { document.body.className = m; },
  url(u) { $("url").textContent = u; },
  card(html) { const c = $("card"); if (html) { c.innerHTML = html; c.classList.remove("show"); void c.offsetWidth; c.classList.add("show"); } else c.classList.remove("show"); },
  tap(x, y) { const t = document.createElement("div"); t.className = "tap"; t.style.left = x + "px"; t.style.top = y + "px"; document.body.append(t); setTimeout(() => t.remove(), 900); },
};
</script>
</body>
</html>
